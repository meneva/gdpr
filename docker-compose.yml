services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdpr_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - gdpr

  nginx:
    image: nginx:latest
    container_name: gdpr_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gdpr

  mysql:
    image: mysql:8.4
    container_name: gdpr_mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gdpr
      MYSQL_USER: gdpr
      MYSQL_PASSWORD: password123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gdpr
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql          
      PMA_USER: root
      PMA_PASSWORD: root       
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"              
    depends_on:
      - mysql                  
    networks:
      - gdpr     

volumes:
  mysql_data:

networks:
  gdpr:
    driver: bridge